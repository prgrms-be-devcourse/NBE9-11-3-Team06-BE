name: "✨ Feature"
description: "새로운 기능 추가 이슈 템플릿"
title: "[Feature] "
labels: ["feature"]
assignees:
  - your-github-username
body:
  - type: input
    attributes:
      label: 📂 이슈 분류 (Group)
      description: 기능이 추가될 코드 영역이나 모듈을 입력해주세요.
      placeholder: 예) 유저 서비스, 결제 도메인 등
  - type: textarea
    attributes:
      label: 🔍 상세 설명 (Detail)
      description: 추가하려는 기능과 그 필요성을 작성해주세요.
      placeholder: 예) 사용자 편의성 향상을 위해 소셜 로그인 기능 추가
    validations:
      required: true
  - type: textarea
    attributes:
      label: ✅ 작업 항목 (Todo)
      description: 수행해야 할 작업들을 체크박스로 작성해주세요.
      placeholder: |
        - [ ] 요구사항 분석
        - [ ] 설계 및 구현
        - [ ] 테스트 코드 작성
        - [ ] 코드 리뷰 요청