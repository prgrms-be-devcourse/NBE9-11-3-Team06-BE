name: "🐛 Bug Report"
description: "버그 이슈 템플릿"
title: "[Bug] "
labels: ["bug"]
assignees:
  - your-github-username
body:
  - type: input
    attributes:
      label: 📂 이슈 분류 (Group)
      description: 버그가 발생한 코드 영역이나 모듈을 입력해주세요.
      placeholder: 예) 인증 서비스, 주문 도메인 등
  - type: textarea
    attributes:
      label: 🔍 상세 설명 (Detail)
      description: 버그 증상, 재현 방법, 예상 동작과 실제 동작을 작성해주세요.
      placeholder: |
        **재현 방법:**
        1. 
        2. 
        
        **예상 동작:**
        
        **실제 동작:**
    validations:
      required: true
  - type: textarea
    attributes:
      label: ✅ 작업 항목 (Todo)
      description: 수행해야 할 작업들을 체크박스로 작성해주세요.
      placeholder: |
        - [ ] 버그 원인 파악
        - [ ] 수정 방안 도출
        - [ ] 코드 수정
        - [ ] 테스트 검증
        - [ ] 영향 범위 검토